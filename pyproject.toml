[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-retail"
version = "0.1.0"
description = "Real-time two-stage e-commerce recommender on RetailRocket: two-tower retrieval, LambdaRank ranking, streaming features, cold start"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "torch>=2.2",
    "faiss-cpu>=1.8",
    "implicit>=0.7",
    "lightgbm>=4.3",
    "scikit-learn>=1.3",
    "redis>=5",
    "confluent-kafka>=2.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
download = ["kaggle>=1.6"]
dev = ["pytest>=8", "ruff>=0.4", "fakeredis[lua]>=2.23", "httpx>=0.27"]
load = ["locust>=2.20", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recsys = ["serving/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["recsys"]
