# Full local stack.
#   docker compose up -d --build                  Redis, API (:8000), Prometheus (:9090), Grafana (:3000)
#   docker compose run --rm warm                  load returning visitors into Redis (once)
#   docker compose --profile streaming up -d      + Kafka (:9092) and the streaming consumer
#   docker compose down -v                        stop and drop data
#
# The API reads ./artifacts (retrieval, ranking, serving) and ./data, built by
# the training scripts and `python -m recsys.serving.bundle`. Events go
# straight to Redis unless RECSYS_EVENTS=kafka (then the consumer applies them).
x-app: &app
  build: .
  image: recsys-retail:latest
  volumes:
    - ./artifacts:/app/artifacts:ro
    - ./data:/app/data:ro
  environment: &app-env
    RECSYS_REDIS: redis://redis:6379/0
    RECSYS_KAFKA: kafka:19092
    RECSYS_EVENTS: ${RECSYS_EVENTS:-direct}
    RECSYS_INDEX: hnsw
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4-alpine
    container_name: recsys-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "1gb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    container_name: recsys-api
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
      WORKERS: ${WORKERS:-2}

  warm:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "recsys.serving.warm", "--redis", "redis://redis:6379/0"]

  consumer:
    <<: *app
    profiles: ["streaming"]
    command: ["python", "-m", "recsys.streaming.consumer", "--bootstrap", "kafka:19092",
              "--redis", "redis://redis:6379/0", "--retrieval", "/app/artifacts/retrieval"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.1
    container_name: recsys-kafka
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: recsys-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    container_name: recsys-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
